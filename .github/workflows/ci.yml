name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

# Actions are pinned to full commit SHAs (the comment names the release); update them deliberately.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # The Firestore emulator (firebase-tools 15) needs Java 21 or newer.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firebase emulator binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Clean install
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npm run test:browser:install

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # Local Firestore emulator only, project "demo-request-ledger". No credentials or secrets.
      - name: Emulator integration tests
        run: npm run test:integration

      - name: Build library and example, check package contents
        run: npm run build

      - name: Browser multi-tab E2E tests (Playwright + Firestore emulator)
        run: npm run test:browser:run

      - name: Upload Playwright failure traces
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: playwright-failure-traces
          path: test-results/traces/
          if-no-files-found: ignore
          retention-days: 14

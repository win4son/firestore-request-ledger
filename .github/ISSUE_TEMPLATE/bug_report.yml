name: Bug Report
description: Report a bug or unexpected behavior in firestore-request-ledger
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: Steps or code snippet (using Firestore Emulator / synthetic data only) to reproduce the issue.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Environment
      description: Library version, Node.js version, and @google-cloud/firestore version.
      placeholder: "firestore-request-ledger 0.1.0 / Node 22.x / @google-cloud/firestore 9.x"
    validations:
      required: true
